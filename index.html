<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catatan Modern - Fitur Lengkap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-slate-50 to-cyan-50 dark:from-slate-900 dark:via-slate-800 dark:to-slate-900 min-h-screen flex items-center justify-center p-4 sm:p-8 font-sans text-slate-800 dark:text-slate-200 antialiased transition-colors duration-500">

    <div class="fade-in w-full max-w-3xl bg-white/80 dark:bg-slate-800/80 backdrop-blur-xl p-6 sm:p-10 rounded-3xl shadow-xl border border-white/60 dark:border-slate-700/60 transition-colors duration-500">
        
        <div class="flex flex-col sm:flex-row justify-between items-center mb-8 gap-4">
            <div class="text-center sm:text-left">
                <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-cyan-500 dark:from-indigo-400 dark:to-cyan-300 mb-2">Catatan Pintar</h1>
                <p class="text-slate-500 dark:text-slate-400 text-sm">Rich text format & filter kata.</p>
            </div>
            <button id="themeToggle" class="p-3 bg-slate-100 dark:bg-slate-700 rounded-full hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors shadow-sm" title="Ganti Tema">
                <span id="themeIcon" class="text-xl">🌙</span>
            </button>
        </div>

        <div class="space-y-6">
            <div class="group">
                <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2 transition-colors">Kata Kunci Filter</label>
                <input type="text" id="filterWords" 
                    class="w-full px-4 py-3 bg-white/50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-600 rounded-xl focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 dark:focus:border-indigo-400 outline-none transition-all shadow-sm" 
                    placeholder="misal: penting, segera">
            </div>

            <div class="flex items-center pt-2">
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="autoNumberToggle" class="sr-only peer">
                    <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:bg-slate-600 peer-checked:bg-indigo-500"></div>
                    <span class="ml-3 text-sm font-semibold text-slate-700 dark:text-slate-300">Penomoran Baris Otomatis</span>
                </label>
            </div>

            <!-- Panel Find & Replace Massal -->
            <div class="bg-slate-50/50 dark:bg-slate-900/40 border border-slate-200 dark:border-slate-700/60 p-5 rounded-2xl space-y-4">
                <div class="flex justify-between items-center">
                    <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 transition-colors">Find & Replace Massal</label>
                    <button type="button" onclick="tambahBarisFindReplace()" class="text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 dark:hover:text-indigo-300 text-xs font-bold flex items-center gap-1 focus:outline-none transition-colors">
                        + Tambah Kata
                    </button>
                </div>
                
                <div id="fr-container" class="space-y-2.5">
                    <!-- Dinamik input baris akan diinjeksi di sini -->
                </div>
                
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pt-1">
                    <label class="relative inline-flex items-center cursor-pointer select-none">
                        <input type="checkbox" id="frCaseSensitive" class="sr-only peer">
                        <div class="w-9 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all dark:bg-slate-600 peer-checked:bg-indigo-500"></div>
                        <span class="ml-2.5 text-xs font-semibold text-slate-700 dark:text-slate-300 transition-colors">Sensitif Kapital (Case Sensitive)</span>
                    </label>
                    <button type="button" onclick="prosesFindReplace()" class="w-full sm:w-auto px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold transition-all shadow-md hover:shadow-indigo-500/20 active:scale-95">
                        Terapkan Penggantian
                    </button>
                </div>
            </div>

            <div class="group">
                <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">Isi Catatan</label>
                
                <div class="flex flex-wrap gap-2 mb-2 p-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl">
                    <button onclick="insertFormat('bold')" class="w-8 h-8 flex items-center justify-center font-bold bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg shadow-sm hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors" title="Tebal (Bold)">B</button>
                    <button onclick="insertFormat('italic')" class="w-8 h-8 flex items-center justify-center italic font-serif bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg shadow-sm hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors" title="Miring (Italic)">I</button>
                    <div class="w-px h-8 bg-slate-300 dark:bg-slate-600 mx-1"></div>
                    <button onclick="insertFormat('strikethrough')" class="w-8 h-8 flex items-center justify-center line-through bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg shadow-sm hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors font-bold" title="Coret (Strikethrough)">S</button>
                    <button onclick="insertFormat('quote')" class="px-3 h-8 flex items-center justify-center text-sm font-serif font-bold bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg shadow-sm hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors" title="Kutipan (Blockquote)">“ ”</button>
                </div>

                <textarea id="noteInput" rows="6" 
                    class="w-full p-4 bg-white/50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-600 rounded-xl focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 dark:focus:border-indigo-400 outline-none transition-all shadow-sm resize-y" 
                    placeholder="Ketik catatanmu di sini..."></textarea>
                
                <!-- Statistik Catatan -->
                <div class="flex justify-between items-center px-1 mt-2 text-[11px] text-slate-400 dark:text-slate-500 transition-colors">
                    <div class="flex gap-4">
                        <span>Kata: <strong id="wordCount" class="text-slate-600 dark:text-slate-300 font-semibold">0</strong></span>
                        <span>Karakter: <strong id="charCount" class="text-slate-600 dark:text-slate-300 font-semibold">0</strong></span>
                        <span>Baris: <strong id="lineCount" class="text-slate-600 dark:text-slate-300 font-semibold">0</strong></span>
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">Pratinjau Langsung</label>
                <div id="highlightedResult" 
                    class="w-full p-5 bg-slate-50/80 dark:bg-slate-900/80 border border-slate-200 dark:border-slate-700 rounded-xl min-h-[150px] whitespace-pre-wrap text-slate-700 dark:text-slate-300 shadow-inner leading-relaxed">
                    <span class="text-slate-400 dark:text-slate-500 italic">Hasil catatan akan muncul di sini...</span>
                </div>
        </div>
        
        <!-- Footer -->
        <footer class="mt-8 pt-6 border-t border-slate-100 dark:border-slate-700/50 text-center text-xs text-slate-400 dark:text-slate-500 transition-colors">
            <p>&copy; 2026 Catatan Pintar. All rights reserved.</p>
            <p class="mt-1">Created by <span class="text-indigo-600 dark:text-indigo-400 font-semibold">Arif Setiawan</span></p>
        </footer>
    </div>

    <script>
        const filterWordsInput = document.getElementById('filterWords');
        const noteInput = document.getElementById('noteInput');
        const highlightedResult = document.getElementById('highlightedResult');
        const autoNumberToggle = document.getElementById('autoNumberToggle');
        const themeToggle = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;

        // Tema
        themeToggle.addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            document.getElementById('themeIcon').textContent = htmlElement.classList.contains('dark') ? '☀️' : '🌙';
        });

        // Keamanan
        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Fungsi Toolbar: Memasukkan format ke dalam Textarea
        function insertFormat(type) {
            const start = noteInput.selectionStart;
            const end = noteInput.selectionEnd;
            const text = noteInput.value;
            const selectedText = text.substring(start, end);
            let replacement = '';

            if (type === 'bold') replacement = `**${selectedText || 'Teks Tebal'}**`;
            if (type === 'italic') replacement = `_${selectedText || 'Teks Miring'}_`;
            if (type === 'strikethrough') replacement = `~~${selectedText || 'Teks Coret'}~~`;
            if (type === 'quote') replacement = selectedText ? `> ${selectedText}` : `\n> `;

            noteInput.value = text.substring(0, start) + replacement + text.substring(end);
            noteInput.focus();
            updateHighlight();
        }

        // Proses utama teks
        function updateHighlight() {
            let rawText = noteInput.value;
            const filterString = filterWordsInput.value;

            // Hitung statistik teks asli
            const charCount = rawText.length;
            const lineCount = rawText === "" ? 0 : rawText.split('\n').length;
            const words = rawText.trim().match(/\S+/g);
            const wordCount = words ? words.length : 0;
            
            document.getElementById('charCount').innerText = charCount;
            document.getElementById('lineCount').innerText = lineCount;
            document.getElementById('wordCount').innerText = wordCount;

            if (!rawText.trim()) {
                highlightedResult.innerHTML = '<span class="text-slate-400 dark:text-slate-500 italic">Hasil catatan akan muncul di sini...</span>';
                return;
            }

            // 1. Penomoran Otomatis Global (Toggle)
            if (autoNumberToggle.checked) {
                const lines = rawText.split('\n');
                let counter = 1;
                rawText = lines.map(line => line.trim().length > 0 ? `${counter++}. ${line}` : line).join('\n');
            }

            // 2. Amankan dari tag HTML liar
            let processText = escapeHTML(rawText);

            // 3. Highlight Filter Kata
            if (filterString.trim()) {
                const wordsToHighlight = filterString.split(',').map(w => escapeHTML(w.trim())).filter(w => w.length > 0);
                if (wordsToHighlight.length > 0) {
                    const escapedWords = wordsToHighlight.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
                    const regex = new RegExp(`(${escapedWords.join('|')})`, 'gi');
                    const hlStyle = '<span class="bg-gradient-to-r from-yellow-200 to-yellow-300 dark:from-yellow-500 dark:to-yellow-600 text-yellow-900 dark:text-white font-medium px-1.5 py-0.5 rounded-md shadow-sm transition-all">$1</span>';
                    processText = processText.replace(regex, hlStyle);
                }
            }

            // 4. Ubah syntax format menjadi elemen visual HTML
            
            // Bold (**teks**)
            processText = processText.replace(/\*\*(.*?)\*\*/g, '<strong class="font-bold text-slate-900 dark:text-white">$1</strong>');
            
            // Italic (_teks_)
            processText = processText.replace(/_(.*?)_/g, '<em class="italic text-slate-800 dark:text-slate-100">$1</em>');
            
            // Strikethrough (~~teks~~)
            processText = processText.replace(/~~(.*?)~~/g, '<del class="line-through text-slate-400 dark:text-slate-500">$1</del>');
            
            // Blockquote (> teks)
            processText = processText.replace(/^&gt;\s?(.*)$/gm, '<blockquote class="border-l-4 border-indigo-500 dark:border-indigo-400 pl-4 py-1 italic my-2 bg-slate-100/50 dark:bg-slate-900/40 text-slate-500 dark:text-slate-400 rounded-r-lg">$1</blockquote>');

            // Render ke pratinjau
            highlightedResult.innerHTML = processText;
        }

        // Event Listeners
        filterWordsInput.addEventListener('input', updateHighlight);
        noteInput.addEventListener('input', updateHighlight);
        autoNumberToggle.addEventListener('change', updateHighlight);

        // --- LOGIKA FIND & REPLACE MASSAL ---
        function tambahBarisFindReplace() {
            const container = document.getElementById('fr-container');
            
            // Batasi maksimal 10 pasang kata
            if (container.children.length >= 10) {
                alert("Maksimal 10 pasangan kata sekaligus!");
                return;
            }
            
            const rowDiv = document.createElement('div');
            rowDiv.className = 'grid grid-cols-12 gap-2 items-center fr-row fade-in';
            rowDiv.innerHTML = `
                <div class="col-span-5">
                    <input type="text" placeholder="Cari kata..." class="w-full px-3 py-2 text-xs bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg outline-none focus:border-indigo-500 dark:focus:border-indigo-400 focus:ring-2 focus:ring-indigo-500/10 transition-all fr-find" required>
                </div>
                <div class="col-span-1 text-center text-slate-400 dark:text-slate-600 text-xs">➜</div>
                <div class="col-span-5">
                    <input type="text" placeholder="Ganti dengan..." class="w-full px-3 py-2 text-xs bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg outline-none focus:border-indigo-500 dark:focus:border-indigo-400 focus:ring-2 focus:ring-indigo-500/10 transition-all fr-replace">
                </div>
                <div class="col-span-1 text-right">
                    <button type="button" onclick="hapusBarisFindReplace(this)" class="text-slate-400 hover:text-red-500 dark:text-slate-500 dark:hover:text-red-400 transition-colors p-1 focus:outline-none text-sm" title="Hapus">
                        ✕
                    </button>
                </div>
            `;
            container.appendChild(rowDiv);
        }

        function hapusBarisFindReplace(btnEl) {
            const container = document.getElementById('fr-container');
            // Jaga minimal 1 baris
            if (container.children.length <= 1) {
                alert("Minimal harus ada 1 pasangan kata!");
                return;
            }
            const row = btnEl.closest('.fr-row');
            row.remove();
        }

        function prosesFindReplace() {
            let text = noteInput.value;
            if (!text.trim()) {
                alert("Tulis isi catatan terlebih dahulu!");
                return;
            }
            
            const rows = document.querySelectorAll('#fr-container .fr-row');
            const pairs = [];
            
            rows.forEach(row => {
                const findVal = row.querySelector('.fr-find').value;
                const replaceVal = row.querySelector('.fr-replace').value;
                if (findVal && findVal.trim() !== '') {
                    pairs.push({ find: findVal, replace: replaceVal });
                }
            });
            
            if (pairs.length === 0) {
                alert("Masukkan minimal 1 kata pencarian!");
                return;
            }
            
            // Baca apakah mode Case Sensitive diaktifkan
            const caseSensitive = document.getElementById('frCaseSensitive').checked;
            
            // Helper untuk meng-escape karakter khusus Regex agar pencarian literal aman
            const escapeRegExp = (str) => str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            
            let replacedCount = 0;
            pairs.forEach(pair => {
                const escapedFind = escapeRegExp(pair.find);
                // Flag: 'g' (global) jika Case Sensitive, 'gi' jika mengabaikan kapital
                const flags = caseSensitive ? 'g' : 'gi';
                const regex = new RegExp(escapedFind, flags);
                
                const matches = text.match(regex);
                if (matches) {
                    replacedCount += matches.length;
                    text = text.replace(regex, pair.replace);
                }
            });
            
            if (replacedCount === 0) {
                alert("Tidak ada kata yang cocok ditemukan!");
                return;
            }
            
            noteInput.value = text;
            updateHighlight();
            
            const modeText = caseSensitive ? "sensitif kapital" : "mengabaikan kapital";
            alert(`Berhasil mengganti ${replacedCount} kemunculan kata (${modeText})!`);
        }

        // Inisialisasi awal Find & Replace
        document.addEventListener('DOMContentLoaded', () => {
            tambahBarisFindReplace();
            tambahBarisFindReplace();
        });
    </script>

</body>
</html>
